name: CodSpeed
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup rust toolchain, cache and cargo-codspeed binary
      uses: moonrepo/setup-rust@v0
      with:
        # Pinned because a transitive dependency (spindle, via faer) fails to
        # compile on newer stable toolchains.
        channel: '1.92.0'
        cache-target: release
        bins: cargo-codspeed
    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: Build the benchmark target(s)
      run: cargo codspeed build -p kcl-ezpz
    - name: Run the benchmarks
      uses: CodSpeedHQ/action@v4
      with:
        upload-url: ${{ secrets.CODSPEED_STAGING_UPLOAD_URL }}
        mode: simulation
        run: cargo codspeed run -p kcl-ezpz
